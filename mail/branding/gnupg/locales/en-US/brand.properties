brandShortName=Thunderbird GnuPG
brandShorterName=TB GnuPG
brandFullName=Thunderbird GnuPG
vendorShortName=mozilla.org

# The name this build puts in outgoing mail headers (`User-Agent`, and
# `Reporting-UA` on read receipts). Deliberately NOT brandFullName: the
# branding above says "Thunderbird GnuPG", and a message header is the one
# place that must not identify which variant sent it. The value matches what
# stock Thunderbird sends, so the two are indistinguishable on the wire.
#
# Read by MimeMessage.sys.mjs and nsMsgMdnGenerator.cpp, both of which fall
# back to brandFullName when this key is absent -- which is the case for
# every other branding, so their behaviour is unchanged.
emailUserAgent=Mozilla Thunderbird
